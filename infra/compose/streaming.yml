name: stokora-streaming-bound
services:
  spark:
    profiles: [streaming]
    image: quay.io/jupyter/pyspark-notebook:spark-4.0.0@sha256:938fdd57901e764b4e6e0adbe7438725e703a782608dc79bd2a7c722a4f8a0bf
    hostname: localhost
    working_dir: /tmp
    entrypoint: [python, -m, pipelines.streaming.consume_cdc]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace:/usr/local/spark/python/lib/pyspark.zip:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      JAVA_TOOL_OPTIONS: -Djava.security.auth.login.config=/run/secrets/stream_jaas
    cpus: 2
    mem_limit: 3g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    secrets: [stream_jaas]
    volumes:
      - ../../pipelines:/workspace/pipelines:ro
      - ../../tests/integration/streaming:/workspace/stream-tests:ro
      - ../../data/local/spark-jars:/opt/bronze-jars:ro
      - ../../data/local/kafka-jars:/opt/kafka-jars:ro
      - stream_data:/home/jovyan/work
    networks: [fixture]
networks:
  fixture:
    external: true
    name: stokora-stream-fixture_data
secrets:
  stream_jaas:
    file: ../../config/secrets/stokora-stream-fixture/stream_jaas
volumes:
  stream_data:
