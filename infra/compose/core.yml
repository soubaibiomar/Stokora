services:
  postgres:
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4, -c, max_slot_wal_keep_size=512MB, -c, password_encryption=scram-sha-256]
    secrets: [postgres_password, cdc_password]
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d stokora"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    profiles: [core]
    image: apache/kafka:4.1.2@sha256:d50ab7b5df612b3c303f9d8afe8fee59626a5de798addfd626fe1924e3205965
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:stokora_admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OPTS: -Djava.security.auth.login.config=/run/secrets/broker_jaas
    secrets: [broker_jaas, broker_admin, broker_observer]
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [data]
    cpus: 1.0
    mem_limit: 1024m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, env, KAFKA_HEAP_OPTS=-Xmx128m, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "kafka:9092", --command-config, /run/secrets/broker_admin, --list]
      interval: 15s
      timeout: 12s
      retries: 12
      start_period: 20s

  connect:
    profiles: [core]
    image: quay.io/debezium/connect:3.4.3.Final@sha256:bad9e9cba46851b6d26cbf4c807630f709897b8b4b3e64fb5f2fbc26e1eec0b0
    entrypoint: [/kafka/bin/connect-distributed.sh, /opt/stokora/worker.properties]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_OPTS: -Djava.security.auth.login.config=/run/secrets/connect_jaas
    secrets: [connect_jaas, connect_database]
    volumes: [../kafka/connectors:/opt/stokora:ro]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    cpus: 1.0
    mem_limit: 1152m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 4s
      retries: 24

secrets:
  cdc_password: {file: "${CORE_SECRET_DIR:?provide an isolated core secret directory}/cdc_password"}
  broker_jaas: {file: "${CORE_SECRET_DIR:?}/broker_jaas"}
  broker_admin: {file: "${CORE_SECRET_DIR:?}/broker_admin"}
  broker_observer: {file: "${CORE_SECRET_DIR:?}/broker_observer"}
  connect_jaas: {file: "${CORE_SECRET_DIR:?}/connect_jaas"}
  connect_database: {file: "${CORE_SECRET_DIR:?}/connect_database"}

volumes:
  kafka_data:
