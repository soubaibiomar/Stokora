name: stokora-step06
services:
  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.0.0@sha256:938fdd57901e764b4e6e0adbe7438725e703a782608dc79bd2a7c722a4f8a0bf
    hostname: localhost
    working_dir: /tmp
    entrypoint: [python, -m, pipelines.gold.publish]
    network_mode: none
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace:/opt/gx:/usr/local/spark/python/lib/pyspark.zip:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      GX_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
    cpus: 2
    mem_limit: 3g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    volumes:
      - ../../pipelines:/workspace/pipelines:ro
      - ../../contracts:/workspace/contracts:ro
      - ../../tests/integration/lambda:/workspace/checks:ro
      - ../../data/local/spark-jars:/opt/bronze-jars:ro
      - batch_bronze:/batch:ro
      - stream_bronze:/stream:ro
      - gx:/opt/gx:ro
      - derived:/home/jovyan/work
volumes:
  batch_bronze:
    external: true
    name: stokora-processing_bronze_data
  stream_bronze:
    external: true
    name: stokora-step05-gate-retest_stream_data
  gx:
    external: true
    name: stokora-step06_gx19
  derived:
