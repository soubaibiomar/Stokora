name: stokora-step07
services:
  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.0.0@sha256:938fdd57901e764b4e6e0adbe7438725e703a782608dc79bd2a7c722a4f8a0bf
    hostname: localhost
    working_dir: /tmp
    entrypoint: [python, -m, pipelines.ml.run_baselines]
    network_mode: none
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace:/opt/gx:/usr/local/spark/python/lib/pyspark.zip:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
    cpus: 2
    mem_limit: 3g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    volumes:
      - ../../pipelines:/workspace/pipelines:ro
      - ../../contracts:/workspace/contracts:ro
      - ../../tests/ml:/workspace/tests/ml:ro
      - ../../data/local/spark-jars:/opt/bronze-jars:ro
      - gold:/gold:ro
      - gx:/opt/gx:ro
      - features:/home/jovyan/work
volumes:
  gold:
    external: true
    name: stokora-step06-baseline_derived
  features:
  gx:
    external: true
    name: stokora-step06_gx19
