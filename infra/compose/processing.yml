name: stokora-processing

services:
  spark:
    profiles: [processing]
    image: quay.io/jupyter/pyspark-notebook:spark-4.0.0@sha256:938fdd57901e764b4e6e0adbe7438725e703a782608dc79bd2a7c722a4f8a0bf
    hostname: localhost
    network_mode: none
    working_dir: /tmp
    entrypoint: [python, -m, pipelines.batch.import_m5]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace:/usr/local/spark/python/lib/pyspark.zip:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
    cpus: 2.0
    mem_limit: 3g
    shm_size: 16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    volumes:
      - ../../pipelines:/workspace/pipelines:ro
      - ../../tests/data/fixtures/m5:/workspace/tests/data/fixtures/m5:ro
      - ../../tests/integration/batch:/workspace/tests/integration/batch:ro
      - ../../data/local/spark-jars:/opt/bronze-jars:ro
      - ../../data/local/m5:/inputs/m5:ro
      - bronze_data:/home/jovyan/work

volumes:
  bronze_data:
